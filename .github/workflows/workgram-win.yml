# Сборка Windows x64 (Release) из форка AyuGramDesktop на бесплатных серверах GitHub.
# Основано на официальном win.yml Telegram Desktop. Запуск вручную: вкладка Actions, Run workflow.
# Нужны секреты репозитория TDESKTOP_API_ID и TDESKTOP_API_HASH (свои, с my.telegram.org).
name: WorkGram Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Коммит или ветка для сборки"
        default: "d4b7546e77f93ac4c9bb53a3fcf7e9ffbbecf1b5"

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      API_ID: ${{ secrets.TDESKTOP_API_ID }}
      API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Check API credentials.
        shell: bash
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Add repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH (get them at my.telegram.org)"
            exit 1
          fi
          if ! [[ "$API_ID" =~ ^[0-9]{5,10}$ ]]; then
            echo "::error::TDESKTOP_API_ID must be digits only, without spaces or line breaks"
            exit 1
          fi
          if ! [[ "$API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::TDESKTOP_API_HASH must be exactly 32 characters 0-9 a-f, without spaces or line breaks"
            exit 1
          fi
          # api_id не секрет (он виден внутри приложения), поэтому печатаем его по цифрам через пробел: GitHub маскирует только целое значение.
          echo "api_id по цифрам: $(echo "$API_ID" | sed 's/./& /g')"
          echo "api_hash: ${#API_HASH} символов, начало ${API_HASH:0:4}, конец ${API_HASH: -4}"

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-
      - name: Fix MSYS2 diffutils dependency.
        shell: pwsh
        run: |
          $path = "$env:TBUILD\$env:REPO_NAME\Telegram\build\prepare\prepare.py"
          $text = [System.IO.File]::ReadAllText($path)
          if (-not $text.Contains("mingw-w64-x86_64-diffutils")) {
            throw "Expected diffutils dependency not found in prepare.py"
          }
          $text = $text.Replace("mingw-w64-x86_64-diffutils", "diffutils")
          [System.IO.File]::WriteAllText($path, $text)
      - name: Fix legacy ATL include path.
        shell: pwsh
        run: |
          $source = Join-Path $env:VCToolsInstallDir "atlmfc\include"
          $target = Join-Path $env:VCINSTALLDIR "atlmfc\include"

          if (-not (Test-Path (Join-Path $source "atlbase.h"))) {
            throw "ATL headers not found at $source"
          }

          if (-not (Test-Path $target)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            New-Item -ItemType Junction -Path $target -Target $source | Out-Null
          }

          if (-not (Test-Path (Join-Path $target "atlbase.h"))) {
            throw "Legacy ATL include path is still invalid: $target"
          }

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent
      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: WorkGram sources.
        uses: actions/checkout@v7
        with:
          path: wg-src
          submodules: false

      - name: Apply WorkGram.
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python wg-src/workgram/apply.py "$TBUILD/$REPO_NAME"

      - name: Build.
        run: |
          cd /d "%TBUILD%\%REPO_NAME%\Telegram"
          call configure.bat x64 -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D CMAKE_CONFIGURATION_TYPES=Release -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1

          powershell -NoProfile -Command "$p = '..\out\Telegram\Telegram.vcxproj'; $s = [IO.File]::ReadAllText($p); $m = [regex]::Matches($s, 'TDESKTOP_API_ID=([^;<]+)'); if ($m.Count -eq 0) { Write-Error 'API ID definition not found'; exit 1 }; foreach ($v in $m) { if ($v.Groups[1].Value.Trim() -ne '33535050') { Write-Error 'STOP: generated project has an unexpected API ID'; exit 1 } }; Write-Host 'OK: generated project uses the expected API ID'"
          if errorlevel 1 exit /b 1

          set CL=/MP1 %CL%
          cmake --build ..\out --config Release --parallel 1
          
      - name: Collect result.
        run: |
          mkdir artifact
          copy %TBUILD%\%REPO_NAME%\out\Release\*.exe artifact\

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        with:
          name: WorkGram-win64
          path: artifact\
          retention-days: 7
